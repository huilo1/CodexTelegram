[project]
name = "codex-telegram-reports"
version = "0.2.0"
description = "Codex project reports and status questions through a dedicated Telegram user"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["telethon>=1.45,<2", "mcp>=1.20,<2", "python-dotenv>=1,<2", "qrcode>=8.2,<9"]

[project.urls]
Repository = "https://github.com/huilo1/CodexTelegram"
Issues = "https://github.com/huilo1/CodexTelegram/issues"

[project.scripts]
codex-telegram-reports = "codex_telegram_reports.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_telegram_reports"]
